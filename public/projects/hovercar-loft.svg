      <stop offset="55%" stop-color="hsl(255, 45%, 10%)"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#ccff00" stroke-width="1" opacity="0.13"/>
